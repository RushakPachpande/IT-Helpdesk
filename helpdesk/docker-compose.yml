name: helpdesk

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  APP_PORT: 8080
  APP_PUBLIC_URL: ${APP_PUBLIC_URL}
  OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  SEED_ALLOWED_DOMAIN: ${SEED_ALLOWED_DOMAIN}
  MS_CLIENT_ID: ${MS_CLIENT_ID:-}
  MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
  MS_TENANT_ID: ${MS_TENANT_ID:-organizations}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  UPLOAD_DIR: /data/uploads
  WEB_DIST: /app/apps/web/dist

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to the host loopback only, for the Prisma CLI and backups. Not reachable from the LAN.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: helpdesk-app:latest
    environment: *app-env
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec tsx prisma/seed.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: helpdesk-app:latest
    restart: unless-stopped
    environment: *app-env
    command: ["pnpm", "--filter", "@helpdesk/api", "start"]
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: helpdesk-app:latest
    restart: unless-stopped
    environment: *app-env
    command: ["pnpm", "--filter", "@helpdesk/api", "start:worker"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          f=/backups/helpdesk-$$stamp.sql.gz
          if pg_dump --no-owner | gzip > "$$f"; then echo "backup written $$f"; else echo "backup FAILED"; rm -f "$$f"; fi
          u=/backups/uploads-$$stamp.tar.gz
          if tar -czf "$$u" -C /uploads .; then echo "uploads archived $$u"; else echo "uploads archive FAILED"; rm -f "$$u"; fi
          find /backups \( -name 'helpdesk-*.sql.gz' -o -name 'uploads-*.tar.gz' \) -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
